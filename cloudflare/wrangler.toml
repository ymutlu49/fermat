# ─── Cloudflare Worker config for the jimaro.app/fermat proxy ─────
# Deploy with:  wrangler deploy --config cloudflare/wrangler.toml
# (run from the project root)

name = "jimaro-fermat-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Bind the Worker to jimaro.app/fermat* so it intercepts those requests.
# The zone is auto-detected by the wrangler CLI from the route hostname.
[[routes]]
pattern = "jimaro.app/fermat*"
zone_name = "jimaro.app"

# The Worker reads PAGES_ORIGIN at runtime — override here if the Pages
# project name differs from the default in worker.js.
[vars]
PAGES_ORIGIN = "https://fermat-jimaro.pages.dev"
