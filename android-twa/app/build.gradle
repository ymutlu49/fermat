plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yilmazmutlu.ferhengamatematike'
    compileSdk 35

    defaultConfig {
        applicationId "com.yilmazmutlu.ferhengamatematike"
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName "3.1.0"

        // TWA host and path configuration
        manifestPlaceholders = [
            hostName      : "jimaro.app",
            defaultUrl    : "https://jimaro.app/app/",
            launcherName  : "FerMat",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], ' +
                             '"target": { "namespace": "web", "site": "https://jimaro.app" } }]'
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
